           'text-halo-color':'rgba(0,0,0,.85)','text-halo-width':1.1}});
  map.addSource('tr',{type:'geojson',data:fc([])});
  map.addLayer({id:'tr',type:'line',source:'tr',layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':['get','c'],'line-width':['get','w'],'line-opacity':['get','o']}});
  map.addSource('pl',{type:'geojson',data:fc([])});
  map.addLayer({id:'pl',type:'symbol',source:'pl',
    layout:{'text-field':'\u2708','text-size':['get','s'],'text-rotate':['get','b'],
            'text-rotation-alignment':'map','text-allow-overlap':true},
    paint:{'text-color':['get','c'],'text-opacity':['get','o'],'text-halo-color':'#000','text-halo-width':1.1}});
  map.addSource('lb',{type:'geojson',data:fc([])});
  map.addLayer({id:'lb',type:'symbol',source:'lb',
    layout:{'text-field':['get','t'],'text-size':['get','sz'],'text-offset':[0,-1.5],
            'text-anchor':'bottom','text-allow-overlap':true,'text-ignore-placement':true,
            'text-letter-spacing':0.06},
    paint:{'text-color':['get','c'],'text-opacity':['get','op'],
           'text-halo-color':'rgba(0,0,0,.8)','text-halo-width':0.9}});
  ready=true;render(0);keys();
 });
}
function fc(a){return {type:'FeatureCollection',features:a};}
function posAt(tr,T){
 if(T<tr[0][0]||T>tr[tr.length-1][0])return null;
 for(var i=0;i<tr.length-1;i++){var a=tr[i],b=tr[i+1];
  if(a[0]<=T&&T<=b[0]){var u=(T-a[0])/((b[0]-a[0])||1);
   var h0=a[4],h1=b[4],dh=((h1-h0+540)%360)-180;
   return {lon:a[2]+(b[2]-a[2])*u,lat:a[1]+(b[1]-a[1])*u,hdg:(h0+dh*u+360)%360};}}
 return null;}
function render(vt){
 if(!ready)return;
 var T=realAt(vt),planes=[],trails=[],labels=[],na=0,nd=0;
 for(var i=0;i<FL.length;i++){
  var f=FL[i],tk=f.t,isDep=(f.k==='DEP'),mk=f.m||0;
  var mark=isDep?tk[0][0]:tk[tk.length-1][0];
  if(mark>=WIN_FROM&&mark<=T){if(isDep){nd++;}else{na++;}}
  var p=posAt(tk,T);
  if(!p)continue;
  var col=isDep?DEPC:ARRC;
  if(mk===2)col=HEROC;
  planes.push({type:'Feature',properties:{b:(p.hdg-90+360)%360,c:col,
    s:mk===2?26:18,o:mk===2?1:0.85},geometry:{type:'Point',coordinates:[p.lon,p.lat]}});
  if(f.n)labels.push({type:'Feature',
    properties:{t:f.n,c:(mk===2?'#BBDEFB':col),
      sz:(mk===2?13:10),op:(mk===2?1:0.72)},
    geometry:{type:'Point',coordinates:[p.lon,p.lat]}});
  if(TRAILS||mk===2){var co=[];
   for(var q=0;q<tk.length;q++){if(tk[q][0]>T)break;co.push([tk[q][2],tk[q][1]]);}
   co.push([p.lon,p.lat]);
   if(co.length>1)trails.push({type:'Feature',
     properties:{c:col,w:mk===2?3.4:1.4,o:mk===2?0.95:0.4},
     geometry:{type:'LineString',coordinates:co}});}
 }
 map.getSource('pl').setData(fc(planes));
 map.getSource('lb').setData(fc(labels));
 map.getSource('tr').setData(fc(trails));
 if(document.getElementById('ca'))document.getElementById('ca').textContent=na;
 if(document.getElementById('cd'))document.getElementById('cd').textContent=nd;
 var d=new Date(T*1000-4*3600*1000);
 document.getElementById('rt').textContent=pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+' EDT';
 document.getElementById('tlabel').textContent=fmt(vt);
 document.getElementById('scrub').value=vt;ro();}
function loop(){if(!playing)return;var n=performance.now(),dt=(n-lastWall)/1000;lastWall=n;
 currentT+=dt*RATE;
 if(currentT>=VIDEO_LEN){currentT=VIDEO_LEN;playing=false;document.getElementById('playBtn').innerHTML='\u25B6';}
 if(currentT<0){currentT=0;}
 render(currentT);if(playing)requestAnimationFrame(loop);}
window.setRate=function(r){RATE=r;
 document.getElementById('sp').textContent=speedx()+'x real time';
 var b=document.getElementsByClassName('rb');
 for(var i=0;i<b.length;i++){
  b[i].style.background=(parseFloat(b[i].getAttribute('data-r'))===r)?'#4DABF7':'#2a2f3a';}};
window.togglePlay=function(){playing=!playing;
 document.getElementById('playBtn').innerHTML=playing?'\u2759\u2759':'\u25B6';
 if(playing){if(currentT>=VIDEO_LEN)currentT=0;lastWall=performance.now();requestAnimationFrame(loop);}};
window.scrubTo=function(v){playing=false;document.getElementById('playBtn').innerHTML='\u25B6';
 currentT=parseFloat(v);render(currentT);};
var roOn=false;
function keys(){document.addEventListener('keydown',function(e){
 if(e.key==='c'||e.key==='C'){roOn=!roOn;document.getElementById('readout').style.display=roOn?'block':'none';}
 if(e.key==='h'||e.key==='H'){document.body.classList.toggle('clean');setTimeout(function(){map.resize();},50);}
 if(e.key==='t'||e.key==='T'){document.body.classList.toggle('notime');}
 if(e.key==='l'||e.key==='L'){document.body.classList.toggle('nolabels');
   map.setLayoutProperty('lb','visibility',document.body.classList.contains('nolabels')?'none':'visible');}
 if(e.key==='ArrowUp'){e.preventDefault();var r=[0.25,0.5,1,2,4],i=r.indexOf(RATE);setRate(r[Math.min(r.length-1,i+1)]);}
 if(e.key==='ArrowDown'){e.preventDefault();var r2=[0.25,0.5,1,2,4],j=r2.indexOf(RATE);setRate(r2[Math.max(0,j-1)]);}
 if(e.key==='ArrowRight'){e.preventDefault();currentT=Math.min(VIDEO_LEN,currentT+1);render(currentT);}
 if(e.key==='ArrowLeft'){e.preventDefault();currentT=Math.max(0,currentT-1);render(currentT);}
 if(e.key===' '){e.preventDefault();togglePlay();}});map.on('move',ro);}
function ro(){if(!roOn)return;var c=map.getCenter();
 document.getElementById('readout').textContent='center:['+c.lng.toFixed(4)+','+c.lat.toFixed(4)+']  zoom:'+map.getZoom().toFixed(2);}

</script></body></html>
