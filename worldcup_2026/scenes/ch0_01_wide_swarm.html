<script>
/*
  CHAPTER 0 - WIDE SWARM BEFORE SHOT

  Purpose:
  Show busy New York airspace BEFORE the no-fly zone appears.

  Important:
  This is synthetic cold-open traffic.
  It is visual atmosphere, not evidence data.
  The factual evidence comes later in the real flight-data chapters.
*/

var B = 1784476800;
var FLIGHTS = {};

function addFlight(id, kind, startLon, startLat, endLon, endLat, alt1, alt2, heading, offset) {
  FLIGHTS[id] = {
    callsign: id,
    kind: kind,
    track: [
      [B + offset,       startLat, startLon, alt1, heading],
      [B + offset + 300, (startLat * 0.66 + endLat * 0.34), (startLon * 0.66 + endLon * 0.34), Math.round((alt1 * 0.66 + alt2 * 0.34)), heading],
      [B + offset + 600, (startLat * 0.34 + endLat * 0.66), (startLon * 0.34 + endLon * 0.66), Math.round((alt1 * 0.34 + alt2 * 0.66)), heading],
      [B + offset + 900, endLat, endLon, alt2, heading]
    ]
  };
}

/*
  Synthetic swarm around New York.
  Mix of arrivals and departures from multiple directions.
*/

var routes = [
  [-[
75.10,40.50,-73.70,40.90,75],
[-75.00,41.10,-73.80,40.75,105],
  [-74.80,39.95,-73.95,40.85,35],
  [-72.75,40.70,-74.20,40.82,280],
  [-73.20,41.35,-74.15,40.70,220],
  [-74.95,41.45,-73.85,40.70,140],
  [-72.65,41.00,-74.05,40.80,255],
  [-75.35,40.90,-74.00,40.84,90],
  [-74.55,39.90,-74.02,40.84,20],
  [-73.15,40.25,-74.18,40.82,300],

  [-74.06,40.85,-73.00,40.45,115],
  [-74.17,40.69,-73.40,41.30,35],
  [-73.87,40.77,-74.70,41.35,315],
  [-73.78,40.64,-72.55,40.90,70],
  [-74.06,40.85,-75.30,40.75,260],
  [-73.87,40.77,-73.45,39.70,160],
  [-74.17,40.69,-75.15,41.10,295],
  [-73.78,40.64,-74.78,40.18,235],
  [-74.06,40.85,-73.78,41.75,10],
  [-74.17,40.69,-72.82,40.80,85]
];

for (var i = 0; i < 60; i++) {
  var r = routes[i % routes.length];

  var jitterLon1 = (Math.random() - 0.5) * 0.18;
  var jitterLat1 = (Math.random() - 0.5) * 0.14;
  var jitterLon2 = (Math.random() - 0.5) * 0.18;
  var jitterLat2 = (Math.random() - 0.5) * 0.14;

  var kind = i % 3 === 0 ? "DEP" : "ARR";
  var id = "SWARM" + String(i + 1).padStart(3, "0");

  var startAlt = kind === "ARR" ? 2200 + (i % 6) * 120 : 400 + (i % 5) * 80;
  var endAlt   = kind === "ARR" ? 500 + (i % 5) * 60 : 2400 + (i % 6) * 120;

  addFlight(
    id,
    kind,
    r[0] + jitterLon1,
    r[1] + jitterLat1,
    r[2] + jitterLon2,
    r[3] + jitterLat2,
    startAlt,
    endAlt,
    r[4],
    (i % 12) * 28
  );
}
</script>
