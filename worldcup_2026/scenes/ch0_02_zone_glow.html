<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CH0 02 Zone Appears Glow</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    #dimWash {
      position: absolute;
      inset: 0;
      z-index: 12;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.24);
      opacity: 0;
      animation: dimIn 1.8s ease-out 3.1s forwards;
    }

    #zoneOverlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.92);
      animation: zoneAppear 1.25s ease-out 1.8s forwards;
    }

    .zoneRing {
      position: absolute;
      left: 44.8%;
      top: 42.8%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 3px dashed rgba(255, 59, 48, 0.95);
      background: rgba(255, 59, 48, 0.055);
      box-shadow: 0 0 18px rgba(255, 59, 48, 0.65), inset 0 0 18px rgba(255, 59, 48, 0.18);
    }

    .zoneRing.outer {
      width: 410px;
      height: 410px;
      border-width: 2px;
      background: rgba(255, 59, 48, 0.035);
      animation: glowOuter 1.7s ease-in-out 3.3s infinite alternate;
    }

    .zoneRing.inner {
      width: 132px;
      height: 132px;
      animation: glowInner 1.45s ease-in-out 3.2s infinite alternate;
    }

    .zoneLabel {
      position: absolute;
      left: 44.8%;
      top: 42.8%;
      transform: translate(-50%, -50%);
      margin-top: -234px;
      padding: 7px 11px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: #ff7670;
      background: rgba(0, 0, 0, 0.62);
      border: 1px solid rgba(255, 59, 48, 0.45);
      border-radius: 999px;
      text-shadow: 0 2px 10px #000;
      opacity: 0;
      animation: labelIn 0.8s ease-out 2.8s forwards;
    }

    @keyframes zoneAppear {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes dimIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes labelIn {
      from { opacity: 0; transform: translate(-50%, -50%) translateY(8px); }
      to   { opacity: 1; transform: translate(-50%, -50%) translateY(0); }
    }

    @keyframes glowInner {
      from {
        border-color: rgba(255, 59, 48, 0.75);
        box-shadow: 0 0 14px rgba(255, 59, 48, 0.55), inset 0 0 14px rgba(255, 59, 48, 0.16);
      }
      to {
        border-color: rgba(255, 130, 120, 1);
        box-shadow: 0 0 38px rgba(255, 59, 48, 1), inset 0 0 30px rgba(255, 59, 48, 0.34);
      }
    }

    @keyframes glowOuter {
      from {
        border-color: rgba(255, 59, 48, 0.55);
        box-shadow: 0 0 18px rgba(255, 59, 48, 0.36), inset 0 0 20px rgba(255, 59, 48, 0.10);
      }
      to {
        border-color: rgba(255, 130, 120, 0.95);
        box-shadow: 0 0 50px rgba(255, 59, 48, 0.85), inset 0 0 38px rgba(255, 59, 48, 0.20);
      }
    }
  </style>
</head>

<body>
<div id="dimWash"></div>

<div id="zoneOverlay">
  <div class="zoneRing outer"></div>
  <div class="zoneRing inner"></div>
  <div class="zoneLabel">RESTRICTED AIRSPACE</div>
</div>

<script>
/*
  CHAPTER 0 - SHOT 2
  Synthetic cold-open swarm with animated no-fly zone overlay.
  Visual atmosphere only, not factual flight evidence.
*/

var B = 1784476800;
var FLIGHTS = {};

function pseudoRandom(n) {
  var x = Math.sin(n * 999.17) * 10000;
  return x - Math.floor(x);
}

function addFlight(id, kind, startLon, startLat, endLon, endLat, alt1, alt2, heading, offset) {
  FLIGHTS[id] = {
    callsign: id,
    kind: kind,
    track: [
      [B + offset,       startLat, startLon, alt1, heading],
      [B + offset + 300, startLat * 0.66 + endLat * 0.34, startLon * 0.66 + endLon * 0.34, Math.round(alt1 * 0.66 + alt2 * 0.34), heading],
      [B + offset + 600, startLat * 0.34 + endLat * 0.66, startLon * 0.34 + endLon * 0.66, Math.round(alt1 * 0.34 + alt2 * 0.66), heading],
      [B + offset + 900, endLat, endLon, alt2, heading]
    ]
  };
}

var routes = [
  [-75.10, 40.50, -73.70, 40.90, 75],
  [-75.00, 41.10, -73.80, 40.75, 105],
  [-74.80, 39.95, -73.95, 40.85, 35],
  [-72.75, 40.70, -74.20, 40.82, 280],
  [-73.20, 41.35, -74.15, 40.70, 220],
  [-74.95, 41.45, -73.85, 40.70, 140],
  [-72.65, 41.00, -74.05, 40.80, 255],
  [-75.35, 40.90, -74.00, 40.84, 90],
  [-74.55, 39.90, -74.02, 40.84, 20],
  [-73.15, 40.25, -74.18, 40.82, 300],

  [-74.06, 40.85, -73.00, 40.45, 115],
  [-74.17, 40.69, -73.40, 41.30, 35],
  [-73.87, 40.77, -74.70, 41.35, 315],
  [-73.78, 40.64, -72.55, 40.90, 70],
  [-74.06, 40.85, -75.30, 40.75, 260],
  [-73.87, 40.77, -73.45, 39.70, 160],
  [-74.17, 40.69, -75.15, 41.10, 295],
  [-73.78, 40.64, -74.78, 40.18, 235],
  [-74.06, 40.85, -73.78, 41.75, 10],
  [-74.17, 40.69, -72.82, 40.80, 85]
];

for (var i = 0; i < 70; i++) {
  var r = routes[i % routes.length];
  var kind = i % 3 === 0 ? "DEP" : "ARR";
  var id = "SWARM" + String(i + 1).padStart(3, "0");

  var j1 = (pseudoRandom(i + 1) - 0.5) * 0.20;
  var j2 = (pseudoRandom(i + 81) - 0.5) * 0.14;
  var j3 = (pseudoRandom(i + 161) - 0.5) * 0.20;
  var j4 = (pseudoRandom(i + 241) - 0.5) * 0.14;

  var startAlt = kind === "ARR" ? 2300 + (i % 6) * 120 : 450 + (i % 5) * 80;
  var endAlt   = kind === "ARR" ? 550 + (i % 5) * 60 : 2200 + (i % 6) * 120;

  addFlight(
    id,
    kind,
    r[0] + j1,
    r[1] + j2,
    r[2] + j3,
    r[3] + j4,
    startAlt,
    endAlt,
    r[4],
    (i % 18) * 24
  );
}
</script>
