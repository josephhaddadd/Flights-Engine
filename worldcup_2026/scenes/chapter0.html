<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chapter 0 - Cold Open</title>
</head>
<body>
<script>
(function(){

  /*
    CHAPTER 0 - COLD OPEN
    Purpose:
    Wide New York airspace preview.
    Normal circulation -> restriction context -> Teterboro becomes the focus.

    This uses the SAME engine pattern as your working Chapter 4 file.
    No new Mapbox imports.
    No separate token hunting.
    No experimental standalone code.
  */

  var d = document.createElement('script');

  // Same data source as Chapter 4.
  // This should show the Final Day traffic around Teterboro / NYC.
  d.src = '../scenes_data/teb_day.js';

  d.onload = function(){
    var e = document.createElement('script');
    e.src = '../../engine.js';
    e.onload = go;
    e.onerror = function(){
      document.body.innerHTML =
        '<p style="color:#fff;padding:20px;background:#000;font-family:Arial">engine.js failed to load.</p>';
    };
    document.body.appendChild(e);
  };

  d.onerror = function(){
    document.body.innerHTML =
      '<p style="color:#fff;padding:20px;background:#000;font-family:Arial">teb_day.js failed to load.</p>';
  };

  document.body.appendChild(d);

  function go(){

    Holiscope({
      style : "mapbox://styles/josephhaddadd/cms3kjwjp018601s7e5qfb73r",

      token : "pk.eyJ1Ijoiam9zZXBoaGFkZGFkZCIsImEiOiJjbXM2ZGoxYjgwNjNzMnlvYmN6cjloYWViIn0.uI9COa39fsVi3tc629QsYA",

      /*
        Cold open duration.
        You narrate over this in CapCut.
      */
      length : "0:45",

      /*
        This is intentionally wider than Chapter 4.
        It shows the day developing, not only the 8am-1pm rush.
        If this feels too slow, we can tighten it later.
      */
      window : ["08:00","20:00"],

      dateEpoch : 1784419200,
      dateLabel : "Sunday 19 July 2026",
      utcOffset : -4,

      /*
        Wide NYC / north New Jersey frame.
        This gives you JFK, LGA, EWR, TEB, MetLife, Westchester, Morristown.
      */
      camera : [-74.10, 40.82, 8.35],

      /*
        Direction colouring gives movement and visual energy.
      */
      colour : "by_direction",

      /*
        Cold open should not be cluttered.
      */
      labels : "none",

      /*
        Trails make the airspace feel alive.
        If too cluttered, change this to "none".
      */
      trails : "on",

      /*
        Planes vanish when they leave the selected time window.
      */
      vanish : true,

      /*
        These are the important places for the cold open.
        The viewer immediately understands the geography.
      */
      places : [
        { name:"MetLife Stadium", at:[-74.0745,40.8135], style:"venue" },

        { name:"Teterboro", at:[-74.0608,40.8501], style:"airport" },
        { name:"Newark", at:[-74.1687,40.6895], style:"airport" },
        { name:"LaGuardia", at:[-73.8740,40.7769], style:"airport" },
        { name:"JFK", at:[-73.7781,40.6413], style:"airport" },

        { name:"Westchester", at:[-73.7076,41.0670], style:"airport" },
        { name:"Morristown", at:[-74.4149,40.7994], style:"airport" },
        { name:"Stewart", at:[-74.1048,41.5041], style:"airport" },
        { name:"Boston", at:[-71.0052,42.3656], style:"airport" },
        { name:"Philadelphia", at:[-75.2411,39.8744], style:"airport" },
        { name:"Allentown", at:[-75.4408,40.6521], style:"airport" }
      ],

      /*
        IMPORTANT:
        I am leaving zones empty for this version because I do not yet know
        the exact zone object format your engine expects.
        This keeps the file working.

        We can add the red no-fly-zone circle next as a safe engine update
        once you show me one working scene that already uses zones.
      */
      zones : [],

      show : {
        clock:true,
        counters:true,
        zones:false,
        placeLabels:true
      }
    });
  }
})();
</script>
</body>
</html>
